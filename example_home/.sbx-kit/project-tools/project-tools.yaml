# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Project tools via mise
description: Installs the tools from the workspace's mise.sandbox.toml once at create, plus egress to their documentation.

kind: mixin
version: "1.0.0"
# Ensures the sbx/mise kit's hooks run before this kit's install hook.
requires: ["mise"]

args:
  configFile:
    default: mise.sandbox.toml
    pattern: '^[A-Za-z0-9._-]+$'
    description: mise config file in the workspace root; mise reads only this file
    # Also exported to the container so the agent's shell uses the same file.
    env: MISE_OVERRIDE_CONFIG_FILENAMES

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # Adjust per project: add the download hosts of the tools in mise.sandbox.toml.
      # `sbx policy log` shows blocked hosts.
      # Examples: crates.io, static.crates.io, static.rust-lang.org (rust),
      #           repo.maven.apache.org (maven), pypi.org, files.pythonhosted.org (python).
      # Open only while install hooks run, closed before the agent starts.
      install:
        allow:
          # apt sources of sbx/shell; apt-get update fails if any is unreachable.
          - deb.debian.org
          - dhi.io
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - nodejs.org
          - registry.npmjs.org
          - mise-java.jdx.dev
          - services.gradle.org
          - downloads.gradle.org
      runtime:
        allow:
          - docs.oracle.com:443
          - docs.gradle.org:443
          - pandoc.org:443
          - docs.asciidoctor.org:443
          - docs.python.org:443
          - nodejs.org:443

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Prebuilt Node binaries need libatomic, which sbx/shell does not ship.
        - command: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libatomic1
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Install shared libraries the mise tools need
        # The hardened base image ships /usr/bin/vim.basic but no `vim` alternatives link.
        - command: ln -sf /usr/bin/vim.basic /usr/bin/vim
          user: "0"
          description: Make vim callable by its usual name
        - command: |
            cd "$WORKSPACE_DIR"
            if [ ! -f "${{ kit.args.configFile }}" ]; then
              echo "no ${{ kit.args.configFile }} in $WORKSPACE_DIR, skipping mise install"
              exit 0
            fi
            export MISE_OVERRIDE_CONFIG_FILENAMES="${{ kit.args.configFile }}"
            export MISE_USE_VERSIONS_HOST=false
            /usr/local/bin/mise trust "$WORKSPACE_DIR/${{ kit.args.configFile }}"
            /usr/local/bin/mise install --yes
          user: "1000"
          env: [WORKSPACE_DIR, HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
          description: Trust and install the tools listed in the workspace's mise config
        # Global opencode instructions: the sandbox and the installed tools.
        # The project's own AGENTS.md stays untouched. Never fails the install.
        - command: |
            export HOME="${HOME:-/home/agent}"
            export MISE_OVERRIDE_CONFIG_FILENAMES="${{ kit.args.configFile }}"
            file="$HOME/.config/opencode/AGENTS.md"
            mkdir -p "$HOME/.config/opencode"
            cd "$WORKSPACE_DIR" || exit 0
            tools=$(/usr/local/bin/mise ls --current --no-header 2>/dev/null | awk '{print "- " $1 " " $2}')
            [ -f "$file" ] && sed -i '/<!-- sbx-tools:begin -->/,/<!-- sbx-tools:end -->/d' "$file"
            cat >> "$file" <<'EOF'
            <!-- sbx-tools:begin -->
            # Sandbox environment

            You run inside a Docker sandbox (Linux microVM), not on the user's computer.

            - The network is restricted. Only the model API and a few documentation hosts are reachable. A blocked request is not a bug in the project.
            - Do not try to install software with apt or `npm -g`. Tools come from the sandbox's mise config and are installed once when the sandbox is created.
            - To see the tools: `mise ls`. Changing the tool list needs a new sandbox, so ask the user.
            - Project instructions are in the project's own AGENTS.md, if there is one.

            Tools installed by mise (name, version):

            EOF
            printf '%s\n' "${tools:-- none}" >> "$file"
            printf '<!-- sbx-tools:end -->\n' >> "$file"
            exit 0
          user: "1000"
          env: [WORKSPACE_DIR]
          description: Write the sandbox and tool overview into the global opencode AGENTS.md
