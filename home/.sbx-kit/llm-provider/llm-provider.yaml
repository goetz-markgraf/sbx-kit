# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: OpenAI-compatible LLM provider for opencode
description: Proxy-managed credential, egress to one endpoint and an opencode plugin that lists its models.

kind: mixin
version: "1.0.0"

args:
  id:
    required: true
    pattern: '^[a-z0-9-]+$'
    description: Provider ID in opencode and service name of the sbx secret
  host:
    required: true
    pattern: '^[a-z0-9.-]+$'
    description: API host, the only destination the credential is injected into
  name:
    default: ""
    pattern: '^[A-Za-z0-9 ._-]*$'
    description: Display name in opencode; empty uses the provider ID
  basePath:
    default: /v1
    pattern: '^/[A-Za-z0-9/_-]*$'
    description: Path of the OpenAI-compatible API on the host
  envName:
    default: LLM_API_KEY
    pattern: '^[A-Z_][A-Z0-9_]*$'
    description: Placeholder variable inside the sandbox
  defaultModel:
    default: ""
    pattern: '^[A-Za-z0-9._/@:-]*$'
    description: Optional model ID (without provider prefix) to preselect; empty selects the first model the API lists

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - ${{ kit.args.host }}:443

  - type: com.docker.sandbox/credential@1
    config:
      service: ${{ kit.args.id }}
      phase: runtime
      apiKey:
        name: ${{ kit.args.envName }}
        proxyManaged: true
        inject:
          - domain: ${{ kit.args.host }}
            header: Authorization
            format: "Bearer %s"

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Runs on every boot but only acts while opencode.json has no `model`,
        # so a model chosen later is not overridden. Needs the runtime egress to
        # the API host; the proxy injects the real key into the request.
        - command: |
            cfg="$HOME/.config/opencode/opencode.json"
            mkdir -p "$(dirname "$cfg")"
            [ -f "$cfg" ] || echo '{}' > "$cfg"
            if jq -e '.model' "$cfg" >/dev/null 2>&1; then exit 0; fi
            model="${{ kit.args.defaultModel }}"
            if [ -z "$model" ]; then
              model=$(curl -fsS -m 20 -H "Authorization: Bearer proxy-managed" \
                "https://${{ kit.args.host }}${{ kit.args.basePath }}/models" | jq -r '.data[0].id // empty') || true
            fi
            if [ -z "$model" ]; then
              echo "llm-provider: no default model found, leaving opencode.json unchanged"
              exit 0
            fi
            jq --arg m "${{ kit.args.id }}/$model" '.model = $m' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Preselect a default model in opencode.json if none is set
      files:
        - path: /home/agent/.config/opencode/plugins/${{ kit.args.id }}.ts
          mode: "0644"
          description: opencode plugin that registers the provider with its current model list
          content: |
            import { Model, Plugin, Provider } from "@opencode/plugin"

            const id = "${{ kit.args.id }}"
            const displayName = "${{ kit.args.name }}" || id
            const baseURL = "https://${{ kit.args.host }}${{ kit.args.basePath }}"
            // Only a placeholder; the sbx proxy replaces it with the real key.
            const apiKey = process.env["${{ kit.args.envName }}"] ?? "proxy-managed"

            export default Plugin.define({
              id: `provider.${id}`,
              async setup(ctx) {
                const response = await fetch(`${baseURL}/models`, {
                  headers: { Authorization: `Bearer ${apiKey}` },
                })
                if (!response.ok) {
                  console.error(`${id}: model list failed with HTTP ${response.status}`)
                  return
                }
                const body = (await response.json()) as { data: { id: string }[] }

                const providerID = Provider.ID.make(id)
                const models = body.data.map((m) => Model.Info.default(providerID, Model.ID.make(m.id)))

                await ctx.provider.transform((editor) => {
                  editor.add({
                    info: {
                      ...Provider.Info.empty(providerID),
                      name: displayName,
                      activation: "enabled",
                      package: "@opencode/ai/providers/openai-compatible",
                      settings: { baseURL, apiKey },
                    },
                    models,
                  })
                })
              },
            })
