schemaVersion: "1"

# Project part of the sandbox configuration. Everything shared between
# projects (agent, base kits, history, host config) comes from
# ~/.sbxenv.yaml and ~/.sbx-kit/. sbx merges both files when it is started
# without a path argument: run `sbx env run` from this directory.
#
# This file sits in the workspace root, so sbx mounts it read-only.
# It must not contain host commands (lifecycle).

# Required: `name` cannot be set in ~/.sbxenv.yaml.
name: ${{ env.args.sandboxName }}

args:
  sandboxName:
    default: sbx-kit
  # Model provider of this project: any OpenAI-compatible API. The keys of
  # `secrets` and `bindings` below must equal providerId and the binding
  # domain must equal providerHost (map keys cannot use args). This example
  # uses Requesty; for another provider change these four values, e.g.
  # openrouter / OpenRouter / openrouter.ai / /api/v1.
  providerId:
    default: requesty
  providerName:
    default: Requesty
  providerHost:
    default: router.eu.requesty.ai
  providerBasePath:
    default: /v1
  defaultModel:
    default: vertex/claude-sonnet-5-5@eu

# Secrets live in the vault on the host; the sandbox only sees a placeholder.
#
# requesty-management belongs to the optional requesty-plugin kit. The
# management API (api-v2.requesty.ai) is another host than the router, so it
# is its own service. It may use the same vault item as the router if that
# key is allowed to read management data.
secrets:
  requesty:
    ref: op://Employee/RequestyApiKey/password
  requesty-management:
    ref: op://Employee/RequestyApiKey/password

bindings:
  requesty:
    apiKey:
      domains: [router.eu.requesty.ai]
  requesty-management:
    apiKey:
      domains: [api-v2.requesty.ai]

# Optional kit: budget and spend of the Requesty key in the opencode TUI.
# Projects without Requesty, or without need for it, delete the kit entry
# and the `requesty-management` entries in secrets and bindings.
#
# The kit lives centrally in ~/.sbx-kit, but this project opts in. Neither ~
# nor $HOME nor ${HOME} is resolved here (tested), so use the ABSOLUTE path
# of your home directory (replace /Users/dragon). Alternative that does not
# depend on a user name: a Git source (needs `sbx settings set
# kit.allowedSources ...`) or an OCI image:
#   - source: "git+https://github.com/<ORG>/<REPO>.git#ref=<COMMIT>&dir=requesty-plugin"
kits:
  - /Users/dragon/.sbx-kit/requesty-plugin
  # With plugin options:
  # - source: /Users/dragon/.sbx-kit/requesty-plugin
  #   args:
  #     options: '{"sidebar":{"showKeyName":true},"prompt":{"showKeyName":true}}'

  # Optional project-specific kits (appended to the central ones). Paths are
  # relative to this file. Keep project kits small: they are writable by the
  # agent, so review changes with `git diff` and `sbx env plan`.
  #
  # - ./.sbx/my-kit
  # - source: docker.io/example/other-kit:1.0.0
  #   args:
  #     flag: value

# Optional project-specific environment variables:
#
# env:
#   JAVA_TOOL_OPTIONS: -Xmx1g
