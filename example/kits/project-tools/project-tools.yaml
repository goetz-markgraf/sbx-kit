# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Project tools via mise
description: Installs the tools from the workspace's mise.toml once at create, plus egress to their documentation.

kind: mixin
version: "1.0.0"
# Ensures mise-mixin's hooks run before this kit's install hook.
requires: ["mise"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # Open only while install hooks run, closed before the agent starts.
      install:
        allow:
          # apt sources of sbx/shell; apt-get update fails if any is unreachable.
          - deb.debian.org
          - dhi.io
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - nodejs.org
          - registry.npmjs.org
          - mise-java.jdx.dev
          - services.gradle.org
          - downloads.gradle.org
      runtime:
        allow:
          - docs.oracle.com:443
          - docs.gradle.org:443
          - pandoc.org:443
          - docs.asciidoctor.org:443
          - docs.python.org:443
          - nodejs.org:443

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Prebuilt Node binaries need libatomic, which sbx/shell does not ship.
        - command: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libatomic1
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Install shared libraries the mise tools need
        - command: cd "$WORKSPACE_DIR" && MISE_TRUSTED_CONFIG_PATHS=/ MISE_USE_VERSIONS_HOST=false /usr/local/bin/mise install --yes
          user: "1000"
          env: [WORKSPACE_DIR, HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
          description: Install the tools listed in the workspace's mise.toml
