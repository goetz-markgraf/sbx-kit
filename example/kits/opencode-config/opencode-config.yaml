# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: opencode host config
description: Copies the allowlisted opencode config (keybinds, theme, AGENTS.md, skills, ...) from the read-only host mount into ~/.config/opencode on every start.

kind: mixin
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # The source is mounted read-only by sbxenv.yaml (additionalWorkspaces,
        # target must match). lifecycle.initialize in sbxenv.yaml stages only the allowlisted names there.
        # opencode.json and plugins/ are deliberately not copied: the provider
        # comes from kits/llm-provider.
        - command: |
            src=/home/agent/.host-config/opencode
            dst="$HOME/.config/opencode"
            if [ ! -d "$src" ]; then
              echo "opencode-config: no host config at $src, skipping"
              exit 0
            fi
            mkdir -p "$dst"
            for name in AGENTS.md cli.json agents commands skills themes; do
              [ -e "$src/$name" ] || continue
              chmod -R u+w "$dst/$name" 2>/dev/null || true
              rm -rf "$dst/$name"
              cp -R "$src/$name" "$dst/$name"
            done
            # Host plugins are not available here and would need extra egress.
            if [ -f "$dst/cli.json" ]; then
              if command -v jq >/dev/null 2>&1; then
                jq 'del(.plugins)' "$dst/cli.json" > "$dst/cli.json.tmp" && mv "$dst/cli.json.tmp" "$dst/cli.json"
              else
                echo "opencode-config: jq missing, cli.json copied unchanged"
              fi
            fi
          description: Copy the allowlisted opencode host config
