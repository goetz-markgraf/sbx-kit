schemaVersion: "1"
name: ${{ env.args.sandboxName }}
agent: shell

# The directory containing this file is the workspace. sbx mounts this file
# read-only because it sits in the workspace root.
workspace: .

# Login shell so /etc/profile.d puts the mise tools on PATH for opencode.
# `./sbx-env.sh run -- bash` opens a shell instead.
entrypoint: [/bin/bash, -lc]
cmd: ["exec opencode"]

env:
  EDITOR: vim

# historyRoot and hostConfigSrc are set by sbx-env.sh. sbx does not expand
# $HOME or ~ in this file. The patterns exclude ' because the values are
# inserted into single-quoted host commands below. sandboxName becomes a
# directory name that is used with rm -rf: no `..`, no `/`.
args:
  sandboxName:
    default: requesty-test
    description: Sandbox name. Also names the history directory
    pattern: "[A-Za-z0-9]+([._-][A-Za-z0-9]+)*"
  historyRoot:
    required: true
    description: Absolute host directory containing one opencode history directory per sandbox
    pattern: "/[^']+"
  hostConfigSrc:
    required: true
    description: Absolute host path of the opencode config to copy from (allowlisted files only)
    pattern: "/[^']+"

# Runs on the host and needs approval in the plan. Make sure it is safe to run
# repeatedly. The config stage is the allowlist for what the sandbox sees:
# opencode.json and plugins/ are not copied.
lifecycle:
  initialize:
    - name: Prepare history dir and stage opencode config
      command: |
        set -eu
        umask 077
        root='${{ env.args.historyRoot }}'
        src='${{ env.args.hostConfigSrc }}'
        name='${{ env.args.sandboxName }}'
        stage="$root/.config-stage/$name"
        mkdir -p "$root/$name" "$stage"
        chmod -R u+w "$stage"
        find "$stage" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        for entry in AGENTS.md cli.json agents commands skills themes; do
          [ -e "$src/$entry" ] && cp -RL "$src/$entry" "$stage/$entry"
        done
        exit 0
      timeout: 1m

kits:
  - docker.io/sbx/shell:latest
  - docker.io/sbx/opencode-mixin:latest
  - docker.io/sbx/mise:latest
  - ./kits/project-tools
  - ./kits/opencode-config
  - source: ./kits/llm-provider
    args:
      id: requesty
      name: Requesty
      host: router.eu.requesty.ai
      basePath: /v1
      envName: REQUESTY_API_KEY

secrets:
  requesty:
    ref: op://Employee/RequestyApiKey/password

bindings:
  requesty:
    apiKey:
      domains: [router.eu.requesty.ai]

# One history directory per sandbox: opencode runs its own server with its own
# SQLite database, so sandboxes must not share one.
additionalWorkspaces:
  - path: ${{ env.args.historyRoot }}/${{ env.args.sandboxName }}
    target: /home/agent/.local/share/opencode
  # Read-only. The target must match kits/opencode-config.
  - path: ${{ env.args.historyRoot }}/.config-stage/${{ env.args.sandboxName }}
    target: /home/agent/.host-config/opencode
    readOnly: true
